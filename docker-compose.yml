services:

  app:
    container_name: ${APP_HOST}
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres   # dentro de la red de Docker, el host es el nombre del servicio
      POSTGRES_PORT: 5432       # dentro de la red de Docker, Postgres siempre escucha en el 5432
      APP_PORT: 3000            # el servidor escucha en el 3000 dentro del contenedor (APP_PORT de .env es el puerto del host)
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
   
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: ${PGADMIN_HOST}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80" 
    depends_on:
      - postgres

volumes:
  node_modules:
  postgres_data: